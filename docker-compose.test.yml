version: '3.8'

services:
  postgres_test:
    image: postgres:15-alpine
    container_name: hospital_postgres_test
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: hospital_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hospital_test"]
      interval: 2s
      timeout: 3s
      retries: 10
